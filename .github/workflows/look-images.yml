name: Look images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: look-images
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: look-web
            context: .
            file: apps/web/Dockerfile
            hook: RENDER_DEPLOY_HOOK_WEB
          - image: look-media
            context: apps/media-server
            file: apps/media-server/Dockerfile.look
            hook: RENDER_DEPLOY_HOOK_MEDIA
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build settings for the web image
        if: matrix.image == 'look-web'
        run: |
          echo "WEB_URL=http://localhost:3000" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER@L}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Tell Render to deploy
        env:
          HOOK: ${{ secrets[matrix.hook] }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "$HOOK" > /dev/null
